name: Build

on:
  push:
    branches: [nook-main]
    paths-ignore: ['site/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Regression tests
        run: ./scripts/test-editor.sh

      - name: Build
        run: ./build.sh release

      - name: Verify the bundle
        run: |
          ./scripts/verify-nook.sh
          test -x build/Nook.app/Contents/MacOS/Nook
          codesign --verify --deep --strict build/Nook.app
          if otool -L build/Nook.app/Contents/MacOS/Nook | grep -q Sparkle; then exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nook-app
          path: build/Nook.app
